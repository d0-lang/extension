# A release, started by pushing a tag like v0.7.0 on a commit of main. It builds the zips
# the stores get, the Chrome one, the Firefox one and the sources AMO rebuilds the Firefox
# one from, and publishes them as a GitHub Release with the merged PRs since the last tag.
# It uploads nothing to the Chrome Web Store or AMO: the zips are uploaded by hand, so no
# store key lives in this repo's secrets. CONTRIBUTING.md has the steps.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match version $version in package.json: merge the release PR first, then tag its commit"
            exit 1
          fi
          # Only a commit that went through review and CI on main ships.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Read by wxt.config.ts, and packed into the sources zip, so AMO's rebuild names the same commit.
      - run: git rev-parse HEAD | cut -c1-7 > BUILD_COMMIT
      - run: bun run zip
      - run: bun run zip:firefox
      - name: Publish the release
        run: |
          cd .output
          sha256sum dadict-*.zip > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes \
            dadict-*.zip SHA256SUMS
