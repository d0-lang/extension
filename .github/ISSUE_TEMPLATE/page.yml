name: Doesn't work on a page
description: Looking up a word fails, or the popover looks wrong, on some site.
labels: [bug, report]
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 158 on Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DaDict version
      description: Shown on the browser's extensions page.
    validations:
      required: false
  - type: input
    id: site
    attributes:
      label: Site or page address
      placeholder: e.g. https://www.spiegel.de
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here, if you have one.
    validations:
      required: false
